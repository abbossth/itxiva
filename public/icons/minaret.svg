<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="minaretGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  <!-- Base platform -->
  <rect x="10" y="42" width="28" height="3" rx="1.5" fill="url(#minaretGrad)" />
  <rect x="12" y="39" width="24" height="3" rx="1" fill="url(#minaretGrad)" />
  <!-- Main minaret body with taper -->
  <path d="M15 39 L17 18 L31 18 L33 39 Z" fill="url(#minaretGrad)" opacity="0.95" />
  <!-- Decorative bands (Kalta Minor style) -->
  <line x1="16" y1="33" x2="32" y2="33" stroke="#F8FAFC" stroke-width="1" stroke-opacity="0.6" />
  <line x1="16.5" y1="27" x2="31.5" y2="27" stroke="#F59E0B" stroke-width="1.2" />
  <line x1="17" y1="22" x2="31" y2="22" stroke="#F8FAFC" stroke-width="1" stroke-opacity="0.6" />
  <!-- Arch openings -->
  <path d="M22 35 C22 33 26 33 26 35 L26 39 L22 39 Z" fill="#0B1220" opacity="0.6" />
  <path d="M22.5 25 C22.5 24 25.5 24 25.5 25 L25.5 27 L22.5 27 Z" fill="#0B1220" opacity="0.6" />
  <!-- Lantern / Balcony -->
  <rect x="15" y="16" width="18" height="2" rx="0.5" fill="url(#minaretGrad)" />
  <rect x="17" y="12" width="14" height="4" fill="url(#minaretGrad)" />
  <rect x="16" y="10" width="16" height="2" rx="0.5" fill="url(#minaretGrad)" />
  <!-- Dome top -->
  <path d="M18 10 C18 6 30 6 30 10 Z" fill="url(#domeGrad)" />
  <!-- Finial / Spire -->
  <line x1="24" y1="4" x2="24" y2="7" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="24" cy="4" r="1.5" fill="#F59E0B" />
</svg>
